<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <div class="toolbox">
            <div class="tools" draggable="true" id="Player">Player</div>
            <div class="tools" draggable="true" id="Enemy">Enemy</div>
            <div class="tools" draggable="true" id="Coin">Coin</div>
            <div class="tools" draggable="true" id="Power-up">Power-up</div>
            <div class="tools" draggable="true" id="Obstacle">Obstacle</div>
        </div>
        <div class="canvas">
            <h2>Player Score: <span id="score">0</span></h2>
            <canvas id="canvas" width="1200" height="600"></canvas>
        </div>      
    </div>
</body>
<script src="./js/script.js"></script>
